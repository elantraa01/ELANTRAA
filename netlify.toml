[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/**,SETUP_GUIDE.md,.env.example,lib/env.ts"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_STORAGE_BUCKET,NEXT_PUBLIC_WHATSAPP_NUMBER,SMTP_USER,ADMIN_NAME,ADMIN_EMAIL,ADMIN_PASSWORD,NEXTAUTH_URL,NEXT_PUBLIC_SITE_URL,EMAIL_FROM,GOOGLE_CLIENT_ID"
